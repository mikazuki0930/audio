<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><link rel="manifest" href="manifest.webmanifest"><title>My Music</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#f5f6fa;background:#10131a}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:24px 16px 110px}header,.monthbar,.line,.actions,.itemtop{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:26px;margin:0}small,.muted{color:#9aa3b4}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#292f3b;color:white;cursor:pointer}button.primary{background:#638cf5;color:#fff}button:disabled{opacity:.4}.monthbar{margin:28px 0 16px}.monthbar strong{font-size:19px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#9aa3b4;font-size:12px;padding:8px 0}.date{min-height:53px;padding:7px 2px;background:#1d222c;border:1px solid transparent;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:14px}.date.selected{border-color:#8eacff;background:#2b354b}.date.empty{background:none}.dots{display:flex;gap:4px}.dot{width:6px;height:6px;border-radius:50%;background:#628ef4}.dot.music{background:#40bb9b}h2{font-size:18px;margin:28px 0 12px}.item{background:#1d222c;border-radius:14px;padding:14px;margin-bottom:10px}.itemtop{align-items:flex-start}.item strong{overflow-wrap:anywhere}.tag{font-size:12px;color:#9aa3b4;margin-top:5px}.memo{font-size:13px;color:#c6cbd5;white-space:pre-wrap;margin:10px 0}.player{width:100%;margin-top:10px;height:40px}.actions{justify-content:flex-end;margin-top:9px}.actions button{padding:7px 10px;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#10131af5;border-top:1px solid #303744;display:flex;justify-content:center;gap:10px}.bottom button{width:min(45%,250px)}dialog{background:#1d222c;color:white;border:1px solid #465065;border-radius:18px;width:min(94vw,480px);padding:20px}dialog::backdrop{background:#000b}label{display:block;font-size:13px;margin:14px 0 5px;color:#b7c0d0}input,textarea,select{width:100%;background:#10131a;color:white;border:1px solid #465065;border-radius:10px;padding:11px}textarea{min-height:85px;resize:vertical}.formbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.recordstatus{padding:12px;background:#10131a;border-radius:10px;margin-top:12px}#error{color:#ffb0b0;font-size:13px;white-space:pre-wrap}</style></head><body><main><header><div><h1>My Music</h1><small>音楽の記録</small></div><span style="font-size:28px">♫</span></header><div class="monthbar"><button id="prev" aria-label="前の月">‹</button><strong id="month"></strong><button id="next" aria-label="次の月">›</button></div><div class="calendar" id="calendar"></div><div class="line"><h2 id="daytitle"></h2><small id="count"></small></div><section id="entries"></section></main><div class="bottom"><button id="upload" type="button">↑ ファイル追加</button><button id="record" class="primary" type="button">● 録音する</button></div><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" hidden><dialog id="editor"><form id="editform"><h2 id="editheading" style="margin:0">音声を保存</h2><label for="title">タイトル</label><input id="title" required maxlength="120"><label for="category">分類</label><select id="category"><option value="voice">歌の録音</option><option value="music">音楽制作</option></select><label for="date">日付</label><input id="date" type="date" required><label for="memo">メモ（任意）</label><textarea id="memo"></textarea><p id="error"></p><div class="formbuttons"><button type="button" id="cancel">キャンセル</button><button type="submit" class="primary">保存する</button></div></form></dialog><dialog id="recorder"><h2 style="margin:0">録音する</h2><p class="muted">マイクの利用を許可してください。</p><div class="recordstatus" id="recordstatus">録音待機中</div><p id="recorderror" style="color:#ffb0b0"></p><div class="formbuttons"><button id="closeRecorder">閉じる</button><button id="start" class="primary">● 録音開始</button><button id="stop" class="primary" disabled>■ 停止して保存</button></div></dialog><script>
const $=id=>document.getElementById(id),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let selected=today(),view=new Date().getFullYear()*12+new Date().getMonth(),records=[],pending=null,editing=null,stream=null,rec=null,chunks=[],recordStarted=0,recTimer=null,urls=[];let db;
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('my-music-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('tracks',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function transaction(mode,fn){return new Promise((resolve,reject)=>{let tx=db.transaction('tracks',mode),store=tx.objectStore('tracks');fn(store,resolve,reject);tx.onerror=()=>reject(tx.error)})}
const all=()=>transaction('readonly',(s,resolve,reject)=>{let r=s.getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const put=o=>transaction('readwrite',(s,resolve)=>{s.put(o);s.transaction.oncomplete=resolve});const del=id=>transaction('readwrite',(s,resolve)=>{s.delete(id);s.transaction.oncomplete=resolve});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){urls.forEach(URL.revokeObjectURL);urls=[];const y=Math.floor(view/12),m=view%12,first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();$('month').textContent=`${y}年${m+1}月`;$('calendar').innerHTML=['日','月','火','水','木','金','土'].map(w=>`<div class="weekday">${w}</div>`).join('');for(let i=0;i<first;i++)$('calendar').insertAdjacentHTML('beforeend','<div></div>');for(let d=1;d<=last;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dayRecords=records.filter(r=>r.date===key),dots=(dayRecords.some(r=>r.category==='voice')?'<span class="dot"></span>':'')+(dayRecords.some(r=>r.category==='music')?'<span class="dot music"></span>':'');let b=document.createElement('button');b.className='date'+(key===selected?' selected':'');b.innerHTML=`<span>${d}</span><span class="dots">${dots}</span>`;b.onclick=()=>{selected=key;render()};$('calendar').appendChild(b)}let entries=records.filter(r=>r.date===selected).sort((a,b)=>b.created-a.created);$('daytitle').textContent=`${Number(selected.slice(5,7))}月${Number(selected.slice(8))}日の音声`;$('count').textContent=`${entries.length}件`;$('entries').innerHTML=entries.length?'':'<p class="muted">この日の録音はありません</p>';entries.forEach(r=>{let node=document.createElement('article');node.className='item';let url=URL.createObjectURL(r.blob);urls.push(url);node.innerHTML=`<div class="itemtop"><div><strong>${esc(r.title)}</strong><div class="tag">${r.category==='voice'?'🎤 歌の録音':'♫ 音楽制作'} · ${esc(r.date)}</div></div></div>${r.memo?`<div class="memo">${esc(r.memo)}</div>`:''}<audio class="player" controls preload="metadata" src="${url}"></audio><div class="actions"><button data-act="export">書き出す</button><button data-act="edit">編集</button><button data-act="delete">削除</button></div>`;node.querySelector('[data-act=edit]').onclick=()=>showEditor(null,r);node.querySelector('[data-act=delete]').onclick=async()=>{if(confirm('この音声を削除しますか？')){await del(r.id);await refresh()}};node.querySelector('[data-act=export]').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=r.filename||`${r.title}.webm`;a.click()};$('entries').appendChild(node)})}
async function refresh(){records=await all();render()}function showEditor(blob,existing=null,filename=''){pending=blob;editing=existing;$('editheading').textContent=existing?'音声を編集':'音声を保存';$('title').value=existing?.title||filename.replace(/\.[^.]+$/,'')||'新しい録音';$('category').value=existing?.category||(blob&&filename?'music':'voice');$('date').value=existing?.date||selected;$('memo').value=existing?.memo||'';$('error').textContent='';$('editor').showModal()}
$('editform').onsubmit=async e=>{e.preventDefault();try{let o=editing?{...editing}:{id:crypto.randomUUID(),blob:pending,filename:pending?.name||'recording.webm',created:Date.now()};o.title=$('title').value.trim();o.category=$('category').value;o.date=$('date').value;o.memo=$('memo').value;if(!o.title||!o.blob)throw Error('音声とタイトルが必要です');await put(o);$('editor').close();selected=o.date;view=Number(o.date.slice(0,4))*12+Number(o.date.slice(5,7))-1;pending=null;editing=null;await refresh()}catch(err){$('error').textContent='保存できませんでした。空き容量やブラウザ設定をご確認ください。\n'+err.message}};$('cancel').onclick=()=>$('editor').close();$('upload').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files?.[0];if(f)showEditor(f,null,f.name);e.target.value=''};$('prev').onclick=()=>{view--;selected=`${Math.floor(view/12)}-${String(view%12+1).padStart(2,'0')}-01`;render()};$('next').onclick=()=>{view++;selected=`${Math.floor(view/12)}-${String(view%12+1).padStart(2,'0')}-01`;render()};
$('record').onclick=()=>{$('recorderror').textContent='';$('recordstatus').textContent='録音待機中';$('recorder').showModal()};$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('このブラウザは録音に対応していません');stream=await navigator.mediaDevices.getUserMedia({audio:true});const types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];let mime=types.find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{clearInterval(recTimer);stream?.getTracks().forEach(t=>t.stop());stream=null;let type=rec.mimeType||'audio/webm',ext=type.includes('mp4')?'m4a':'webm',blob=new Blob(chunks,{type});$('recorder').close();showEditor(blob,null,`録音_${new Date().toLocaleString('ja-JP').replace(/[/: ]/g,'-')}.${ext}`);$('category').value='voice';$('start').disabled=false;$('stop').disabled=true};rec.start();recordStarted=Date.now();$('start').disabled=true;$('stop').disabled=false;recTimer=setInterval(()=>{$('recordstatus').textContent=`録音中 ● ${Math.floor((Date.now()-recordStarted)/60000)}:${String(Math.floor((Date.now()-recordStarted)/1000)%60).padStart(2,'0')}`},250)}catch(err){$('recorderror').textContent='録音を開始できません: '+err.message;stream?.getTracks().forEach(t=>t.stop())}};$('stop').onclick=()=>{if(rec?.state==='recording')rec.stop()};$('closeRecorder').onclick=()=>{if(rec?.state==='recording'){if(!confirm('録音を破棄して閉じますか？'))return;rec.onstop=null;rec.stop();stream?.getTracks().forEach(t=>t.stop());clearInterval(recTimer);$('start').disabled=false;$('stop').disabled=true}$('recorder').close()};$('recorder').addEventListener('cancel',e=>{if(rec?.state==='recording'){e.preventDefault();$('closeRecorder').click()}});
(async()=>{try{db=await openDB();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(err){$('entries').textContent='保存機能を利用できません。Safariの通常モードで開いてください。 '+err.message}})();
</script></body></html>
